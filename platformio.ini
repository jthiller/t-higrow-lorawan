; LoRaWAN firmware for the LilyGO T-Higrow (ESP32) with the LoRa shield.
; It sends the same 8-byte payload as the Makerfabs soil sensor firmware
; (lsms092d-lorawan), so one decoder and one dashboard serve both boards.
;
;   pio run -t upload                the sensor firmware
;   pio run -e probe -t upload       a bring-up sketch that prints what is on the board
;   pio device monitor

[platformio]
default_envs = higrow

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; The firmware has no use for the default 240 MHz, and a slower clock draws less.
board_build.f_cpu = 80000000L
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:higrow]
build_src_filter = +<main.cpp>
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@8.0.0

[env:probe]
build_src_filter = +<probe.cpp>
